<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>The Sartorialist – Konfigurator-Film v2</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#101010;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="motion.js"></script>
<script src="ton/sprecher-zeiten.js"></script>
<script>
// ===========================================================================
// The Sartorialist Zürich – «Styles & Options», Fassung 2 (mit Sprecher)
// 35.0 s. 16:9 (Standard) oder 9:16 (?f=9x16). Alle Zeiten folgen den Wortzeiten des Sprechers
// (ton/sprecher-zeiten.js aus ElevenLabs /with-timestamps): gesprochen = gezeigt.
// Eine durchgehende Kamera: Rückzug aus dem Detail → Fokusrahmen → Zoom-Through in die nächste Welt.
//   Hook (Entwurf) → Revers → Knöpfe → (Whip) Taschen → (Flip) Futter → Stoff → (Zoom-out) Übersicht
//   → (Flood) Atelier → (Shape-Morph) Endkarte → Loop (Rack-Focus zurück zum ersten Frame).
// ===========================================================================
const { clamp, lerp, seg, spring, sp, track, trackObj, hex, rgb, mixColor, rng, E } = M;
const Q = new URLSearchParams(location.search);
const V = Q.get('f') === '9x16';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const DUR = 35.0;
const SPR = window.SPRECHER;
const w = (id, i) => SPR[id].worte[i].t;           // Wortbeginn (s)
const we = (id, i) => SPR[id].worte[i].e;          // Wortende (s)

const out = document.getElementById('c'); out.width = W; out.height = H;
const G = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const SC = mk(), g = SC.getContext('2d');
[G, g].forEach((x) => { x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; });

const INK = '#101010', WARM = '#f6f5f2', LINE = '#e5e3de', MUTED = '#6f6c66', GOLD = '#c9a063';
const SERIF = '"Playfair Display", Georgia, serif', SANS = 'Inter, Helvetica, sans-serif';
const p4out = (p) => 1 - Math.pow(1 - clamp(p), 4), p4in = (p) => Math.pow(clamp(p), 4);
const ioc = (p) => E.inOutCubic(clamp(p));

// ---------------------------------------------------------------------------
// Zeitplan (aus den Wortzeiten)
// ---------------------------------------------------------------------------
const T = {
  d1: [w('hook', 7) + 1.33, w('revers', 0) - 0.17],            // Zoom-Through Revers in die Revers-Welt
  clickRevers: w('revers', 3) + 0.12,
  d2: [w('knopf', 0) - 0.7, w('knopf', 0) - 0.04],              // Zoom-Through Knopf → Knöpfe
  clickKnopf: w('knopf', 1) + 0.1,
  d3: [w('tasche', 0) - 0.55, w('tasche', 0) - 0.12],           // Whip-Pan → Taschen
  clickTasche: w('tasche', 1) + 0.1,
  d4: [w('futter', 0) - 0.72, w('futter', 0) - 0.02],           // Flip-Morph → Futter
  checks: [w('futter', 0), w('futter', 2), w('futter', 3), w('futter', 5)],
  d5: [w('stoff', 0) - 0.75, w('stoff', 0) - 0.1],              // Zoom-Through ins Futter → Stoff
  typ: [w('stoff', 3) + 0.05, w('stoff', 5) + 0.15], clickStoff: w('stoff', 5) + 0.45,
  d6: [w('blick', 0) - 0.62, w('blick', 0) + 0.02],             // Zoom-out → Übersicht
  clickPdf: w('blick', 5) + 0.06,
  clickTermin: w('blick', 9) + 0.08,                            // Klick-Flood → Atelier
  d8: [w('preis', 0) - 0.32, w('preis', 0) + 0.42],             // Atelierfoto schrumpft zur Goldlinie
  loop: [34.3, DUR],
};

// ---- Bilder ----
const IMG = {};
const NAMES = ['lapel-sb-peak-regular', 'lapel-sb-notch-regular', 'lapel-sb-shawl-regular', 'sb-1b', 'sb-2b', 'db-6x2',
  'pocket-barchetta-jetted', 'pocket-barchetta-flap', 'pocket-patch-patch', 'lining-lined', 'buttonhole-hand', 'cuff-kissing', 'monogram-lined', 'Holland-Sherry-3-scaled', 'Foto-mit-Schere'];
const loads = NAMES.map((n) => new Promise((r) => { const i = new Image(); i.onload = r; i.onerror = r; i.src = 'img/' + n + '.webp'; IMG[n] = i; }));
const LOGO = new Image(); loads.push(new Promise((r) => { LOGO.onload = r; LOGO.src = 'img/sartorialist-zurich-logo.png'; }));
let LOGO_W;

// ---------------------------------------------------------------------------
// Layout
// ---------------------------------------------------------------------------
const L = V ? { tx: 90, hs: 98, hY: 452, sc: { x: 500, y: 1040 }, cw: 280, gap: 18, th: 96 }
            : { tx: 140, hs: 88, hY: 0, sc: { x: 1340, y: 545 }, cw: 296, gap: 30, th: 98 };
L.ih = L.cw * 1.25; L.ch = L.ih + L.th; L.gy = L.sc.y - L.ch / 2; L.gx0 = L.sc.x - (3 * L.cw + 2 * L.gap) / 2;
const cardRect = (i) => ({ x: L.gx0 + i * (L.cw + L.gap), y: L.gy, w: L.cw, h: L.ch });
const ASP = W / H;
// Fokusrahmen im Seitenverhältnis des Bildes (damit der Zoom-Through exakt bildfüllend landet)
const frameAt = (cx, cy, fw) => ({ x: cx - fw / 2, y: cy - fw / ASP / 2, w: fw, h: fw / ASP });

// ---------------------------------------------------------------------------
// Bausteine
// ---------------------------------------------------------------------------
function contain(g, img, x, y, w2, h, s = 1) {
  if (!img || !img.width) return;
  const k = Math.min(w2 / img.width, h / img.height) * s, iw = img.width * k, ih = img.height * k;
  g.drawImage(img, x + (w2 - iw) / 2, y + (h - ih) / 2, iw, ih);
}
function cover(g, img, x, y, w2, h, zoom = 1, fx = 0.5, fy = 0.5) {
  const k = Math.max(w2 / img.width, h / img.height) * zoom, iw = img.width * k, ih = img.height * k;
  g.drawImage(img, x + (w2 - iw) * fx, y + (h - ih) * fy, iw, ih);
}
function strokeRect(g, x, y, w2, h, col, lw = 1) { g.strokeStyle = col; g.lineWidth = lw; g.strokeRect(x + lw / 2, y + lw / 2, w2 - lw, h - lw); }
function tickMark(g, x, y, r, s, fill = INK, stroke = '#fff') {
  if (s <= 0.01) return;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = fill; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = stroke; g.lineWidth = r * 0.16; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-r * 0.4, 0); g.lineTo(-r * 0.1, r * 0.3); g.lineTo(r * 0.42, -r * 0.3); g.stroke();
  g.restore();
}
function spaced(g, text, x, y, size, col, tr = 3, weight = 600, align = 'left') {
  g.font = `${weight} ${size}px ${SANS}`; g.letterSpacing = tr + 'px'; g.fillStyle = col; g.textAlign = align;
  g.fillText(text.toUpperCase(), x + (align === 'center' ? tr / 2 : 0), y); g.textAlign = 'left'; g.letterSpacing = '0px';
}
function card(g, r, c, st) {
  const { x, y, w: cw } = r, ih = cw * 1.25, th = L.th, h = ih + th;
  g.save();
  const cx = x + cw / 2, cy = y + h / 2;
  g.translate(cx, cy - (st.hover || 0) * 8); g.scale((st.sx ?? 1) * (st.pop ?? 1), st.pop ?? 1); g.translate(-cx, -cy);
  g.fillStyle = '#fff'; g.fillRect(x, y, cw, h);
  contain(g, IMG[c.img], x + 14, y + 14, cw - 28, ih - 22, 1 + 0.035 * (st.hover || 0));
  g.fillStyle = rgb(mixColor(hex('#ffffff'), hex(WARM), st.on || 0)); g.fillRect(x, y + ih, cw, th);
  g.fillStyle = LINE; g.fillRect(x, y + ih, cw, 1);
  spaced(g, c.code, cx, y + ih + th * 0.40, 14, MUTED, 3, 600, 'center');
  g.font = `500 25px ${SERIF}`; g.fillStyle = INK; g.textAlign = 'center'; g.fillText(c.label, cx, y + ih + th * 0.76); g.textAlign = 'left';
  strokeRect(g, x, y, cw, h, rgb(mixColor(hex(LINE), hex(INK), clamp((st.on || 0) + (st.hover || 0) * 0.35))), 1 + (st.on || 0));
  if (st.on > 0) tickMark(g, x + cw - 26, y + 26, 16, sp(st.tOn, 'ui'));
  if (st.shade) { g.fillStyle = `rgba(16,16,16,${st.shade})`; g.fillRect(x, y, cw, h); }
  g.restore();
}
// Fokusrahmen: vier goldene Ecken, die sich um das Detail schliessen
function focusFrame(g, r, p, lw = 2.5) {
  if (p <= 0.01) return;
  const k = 1 + 0.35 * (1 - p4out(p)), cx = r.x + r.w / 2, cy = r.y + r.h / 2, ww = r.w * k, hh = r.h * k, x = cx - ww / 2, y = cy - hh / 2;
  const L2 = Math.min(ww, hh) * 0.22;
  g.save(); g.globalAlpha *= clamp(p * 2); g.strokeStyle = GOLD; g.lineWidth = lw; g.lineCap = 'square';
  g.beginPath();
  [[x, y, 1, 1], [x + ww, y, -1, 1], [x, y + hh, 1, -1], [x + ww, y + hh, -1, -1]].forEach(([a, b2, sx, sy]) => { g.moveTo(a, b2 + sy * L2); g.lineTo(a, b2); g.lineTo(a + sx * L2, b2); });
  g.stroke(); g.restore();
}

// ---------------------------------------------------------------------------
// Kamera: {wx, wy} Weltpunkt → Bildschirmpunkt {ax, ay}, Massstab s, Drehung r (Grad)
// ---------------------------------------------------------------------------
const camM = (c) => new DOMMatrix().translate(c.ax, c.ay).rotate(c.r || 0).scale(c.s).translate(-c.wx, -c.wy);
const ID = () => ({ wx: W / 2, wy: H / 2, ax: W / 2, ay: H / 2, s: 1, r: 0 });

// ---------------------------------------------------------------------------
// WELT 0 – Hook: der fertige Entwurf (Ink)
// ---------------------------------------------------------------------------
const HERO = V ? { x: 90, y: 760, w: 450 } : { x: 860, y: 196, w: 440 };
HERO.ih = HERO.w * 1.3; HERO.th = 86; HERO.h = HERO.ih + HERO.th;
const TAG = V ? { x: 590, w: 350, h: 92, y0: 820, dy: 134 } : { x: 1380, w: 380, h: 86, y0: 268, dy: 132 };
const TAGS = [
  { g: 'Revers', o: 'Steigend', ax: 0.64, ay: 0.27, t: () => w('hook', 2) },
  { g: 'Vorderteil', o: 'Zwei Knöpfe', ax: 0.52, ay: 0.56, t: () => w('hook', 3) },
  { g: 'Taschen', o: 'Barchetta & Patte', ax: 0.72, ay: 0.665, t: () => w('hook', 4) },
  { g: 'Stoff', o: 'Holland & Sherry', ax: 0.86, ay: 0.78, t: () => w('hook', 5) },
];
function heroImgRect() {
  const img = IMG['lapel-sb-peak-regular'], bw = HERO.w - 36, bh = HERO.ih - 30;
  const k = Math.min(bw / img.width, bh / img.height), iw = img.width * k, ih = img.height * k;
  return { x: HERO.x + 18 + (bw - iw) / 2, y: HERO.y + 18 + (bh - ih) / 2, w: iw, h: ih };
}
const heroPt = (fx, fy) => { const r = heroImgRect(); return { x: r.x + r.w * fx, y: r.y + r.h * fy }; };
// Portal 1: Fokusrahmen auf der Reversspitze
const P1 = () => { const p = heroPt(0.64, 0.25); return frameAt(p.x, p.y, V ? 120 : 150); };
function camHook(t) {
  const hc = { x: HERO.x + HERO.w / 2, y: HERO.y + HERO.h / 2 }, up = heroPt(0.5, 0.33), lap = heroPt(0.64, 0.25);
  // Start: nah am Oberkörper, Rückzug auf «Bis», dann sanfte Fahrt Richtung Revers
  const tb = w('hook', 2) - 0.1, tp = w('hook', 7) + 0.35;
  const c = trackObj(t, [
    [0, { wx: up.x, wy: up.y, ax: V ? W / 2 - 30 : hc.x + 90, ay: V ? up.y - 110 : up.y, s: V ? 1.3 : 1.6, r: -1.2 }],
    [tb, { wx: hc.x, wy: hc.y, ax: hc.x, ay: hc.y, s: 1.0, r: 0 }, 60, 16],
    [tp, { wx: lap.x, wy: lap.y, ax: lap.x, ay: lap.y, s: 1.22, r: 0 }, 40, 14],
  ]);
  c.s *= 1 + 0.01 * Math.sin(t * 0.7);
  return c;
}
function worldHook(g, t, a = 1) {
  g.fillStyle = INK; g.fillRect(-W * 2, -H * 2, W * 5, H * 5);
  g.save(); g.globalAlpha *= a;
  const hc = { x: HERO.x + HERO.w / 2 };
  g.fillStyle = '#fff'; g.fillRect(HERO.x, HERO.y, HERO.w, HERO.h);
  const ir = heroImgRect();
  g.drawImage(IMG['lapel-sb-peak-regular'], ir.x, ir.y, ir.w, ir.h);
  // Goldener Lichtschimmer auf «entworfen»
  const ts = w('hook', 7), q = seg(t, ts - 0.1, ts + 1.1);
  if (q > 0 && q < 1) {
    const shx = HERO.x - 300 + q * (HERO.w + 600);
    g.save(); g.beginPath(); g.rect(HERO.x, HERO.y, HERO.w, HERO.ih); g.clip();
    const lg = g.createLinearGradient(shx, HERO.y, shx + 260, HERO.y + 200);
    lg.addColorStop(0, 'rgba(201,160,99,0)'); lg.addColorStop(0.5, 'rgba(201,160,99,.16)'); lg.addColorStop(1, 'rgba(201,160,99,0)');
    g.fillStyle = lg; g.fillRect(HERO.x, HERO.y, HERO.w, HERO.ih); g.restore();
  }
  g.fillStyle = WARM; g.fillRect(HERO.x, HERO.y + HERO.ih, HERO.w, HERO.th);
  g.fillStyle = LINE; g.fillRect(HERO.x, HERO.y + HERO.ih, HERO.w, 1);
  spaced(g, 'Ihr Entwurf', hc.x, HERO.y + HERO.ih + HERO.th * 0.4, 14, MUTED, 3, 600, 'center');
  g.font = `500 25px ${SERIF}`; g.fillStyle = INK; g.textAlign = 'center'; g.fillText('Einreiher, steigendes Revers', hc.x, HERO.y + HERO.ih + HERO.th * 0.76); g.textAlign = 'left';
  // Callouts auf den Wörtern
  const fade = 1 - seg(t, T.d1[0] - 0.5, T.d1[0] - 0.1) * 0.75;
  TAGS.forEach((tg, i) => {
    const t0 = tg.t(), p = p4out((t - t0) / 0.38), pl = ioc((t - t0 - 0.05) / 0.36);
    if (p <= 0) return;
    const ty = TAG.y0 + i * TAG.dy, an = heroPt(tg.ax, tg.ay);
    g.save(); g.globalAlpha *= fade;
    const sx = TAG.x - 14, sy = ty + TAG.h / 2;
    g.strokeStyle = GOLD; g.lineWidth = 1.5; g.beginPath(); g.moveTo(sx, sy); g.lineTo(lerp(sx, an.x, pl), lerp(sy, an.y, pl)); g.stroke();
    if (pl > 0.98) { const pu = sp(t - t0 - 0.4, 'playful'); g.fillStyle = 'rgba(201,160,99,.28)'; g.beginPath(); g.arc(an.x, an.y, 11 * pu, 0, Math.PI * 2); g.fill(); g.fillStyle = GOLD; g.beginPath(); g.arc(an.x, an.y, 5, 0, Math.PI * 2); g.fill(); }
    g.globalAlpha *= clamp(p * 1.4); g.translate((1 - p) * 40, 0);
    g.fillStyle = 'rgba(255,255,255,.045)'; g.fillRect(TAG.x, ty, TAG.w, TAG.h);
    strokeRect(g, TAG.x, ty, TAG.w, TAG.h, 'rgba(255,255,255,.22)');
    tickMark(g, TAG.x + 34, ty + TAG.h / 2, 13, p4out((t - t0 - 0.1) / 0.3), GOLD, INK);
    spaced(g, tg.g, TAG.x + 64, ty + TAG.h * 0.42, 13, 'rgba(255,255,255,.55)', 3);
    g.font = `500 26px ${SERIF}`; g.fillStyle = '#fff'; g.fillText(tg.o, TAG.x + 64, ty + TAG.h * 0.78);
    g.restore();
  });
  // Fokusrahmen (kündigt den Zoom-Through an)
  if (t < T.d1[0]) focusFrame(g, P1(), seg(t, T.d1[0] - 0.55, T.d1[0] - 0.1));
  g.restore();
}

// ---------------------------------------------------------------------------
// WELTEN 1–3 – Kartenraster (Revers, Knöpfe, Taschen), echte Optionen aus daten.ts
// ---------------------------------------------------------------------------
const SETS = [
  { cards: [
    { img: 'lapel-sb-notch-regular', code: 'Fallend', label: 'Normal (8.0 cm)' },
    { img: 'lapel-sb-peak-regular', code: 'Steigend', label: 'Normal (8.0 cm)' },
    { img: 'lapel-sb-shawl-regular', code: 'Schalkragen', label: 'Normal (6.0 cm)' }], pick: 1, click: () => T.clickRevers, t0: () => T.d1[0] },
  { cards: [
    { img: 'sb-1b', code: '1 B', label: 'Ein Knopf' },
    { img: 'db-6x2', code: '6 X 2', label: 'Sechs auf zwei' },
    { img: 'sb-2b', code: '2 B', label: 'Zwei Knöpfe' }], pick: 2, click: () => T.clickKnopf, t0: () => T.d2[0] },
  { cards: [
    { img: 'pocket-barchetta-flap', code: 'Brust · Seite', label: 'Barchetta & Patte' },
    { img: 'pocket-barchetta-jetted', code: 'Brust · Seite', label: 'Barchetta & Paspel' },
    { img: 'pocket-patch-patch', code: 'Brust · Seite', label: 'Aufgesetzt' }], pick: 0, click: () => T.clickTasche, t0: () => T.d3[0] },
];
function cardState(s, i, t) {
  const S = SETS[s], pick = S.pick === i, c = S.click();
  const hover = pick ? sp(t - (c - 0.42), 'ui') * (1 - sp(t - c, 'snappy')) : 0;
  const on = pick && t >= c ? clamp((t - c) / 0.12) : 0;
  const pop = pick ? 1 - 0.035 * Math.sin(Math.PI * seg(t, c - 0.02, c + 0.26)) : 1;
  return { hover, on, pop, tOn: t - c };
}
// Punkt im Bild der gewählten Karte (Bruchteil der Bildfläche)
function cardImgPt(s, fx, fy) { const r = cardRect(SETS[s].pick); return { x: r.x + 14 + (r.w - 28) * fx, y: r.y + 14 + (L.ih - 22) * fy }; }
// Portal 2: Fokusrahmen auf den Knöpfen der gewählten Revers-Karte
const P2 = () => { const p = cardImgPt(0, 0.5, 0.6); return frameAt(p.x, p.y, V ? 92 : 120); };
function worldGrid(g, s, t, opt = {}) {
  if (opt.bg !== false) { g.fillStyle = WARM; g.fillRect(-W * 2, -H * 2, W * 5, H * 5); }
  const S = SETS[s];
  S.cards.forEach((c, i) => {
    if (opt.skip === i) return;
    const r = cardRect(i), st = cardState(s, i, t);
    const tin = S.t0() + 0.12 + i * 0.07, p = p4out((t - tin) / 0.55);   // Karten steigen gestaffelt auf
    r.y += (1 - p) * 70;
    let a = clamp(p * 1.6);
    if (s === 0 && i !== S.pick) a *= 1 - 0.85 * (camGrid0(t).z || 0);
    if (a <= 0.01) return;
    g.save(); g.globalAlpha *= a; card(g, r, c, st); g.restore();
  });
  if (s === 0) {
    // Detail-Karte zum gewählten Revers (Digital Zoom)
    const ti = T.clickRevers + 0.28, pin = p4out((t - ti) / 0.4), pout = seg(t, T.d2[0] - 0.1, T.d2[0] + 0.15);
    if (pin > 0) {
      const r = cardRect(1), bw = V ? 420 : 380, bx = r.x + r.w / 2 - bw / 2, by = r.y + r.h + (V ? 26 : 22) + (1 - pin) * 20, bh = 92;
      g.save(); g.globalAlpha *= clamp(pin * 1.5) * (1 - pout);
      g.fillStyle = '#fff'; g.fillRect(bx, by, bw, bh); strokeRect(g, bx, by, bw, bh, INK); g.fillStyle = GOLD; g.fillRect(bx, by, 3, bh);
      spaced(g, 'Revers — Einreiher, steigend', bx + 24, by + 34, 11, MUTED, 2.5);
      g.font = `italic 500 20px ${SERIF}`; g.fillStyle = INK; g.fillText('Klassisch, in italienischer Manier', bx + 24, by + 68);
      g.restore();
    }
    if (t < T.d2[0]) focusFrame(g, P2(), seg(t, T.d2[0] - 0.5, T.d2[0] - 0.05), 2);
  }
}
function camGrid0(t) {
  // Digital Zoom auf die gewählte Reversspitze
  const f = cardImgPt(0, 0.6, 0.32), base = ID();
  const z = sp(t - (T.clickRevers + 0.18), 'heavy');
  return { wx: lerp(base.wx, f.x, z), wy: lerp(base.wy, f.y, z), ax: lerp(base.ax, f.x + (V ? 0 : 60), z), ay: lerp(base.ay, f.y - (V ? 30 : 40), z), s: 1 + 0.38 * z, r: 0, z };
}
function camDrift(t, t0, amt = 0.025) { const c = ID(); c.s = 1 + amt * seg(t, t0, t0 + 3); return c; }

// ---------------------------------------------------------------------------
// WELT 4 – Futter & Details (Checklist Pop)
// ---------------------------------------------------------------------------
const CHECK = [['Futter', 'Gefüttert'], ['Knopfloch am Revers', 'Handgenäht'], ['Ärmelknöpfe', 'Kissing Buttons'], ['Monogramm innen', 'Monogramm im Futter']];
const LIN = V ? { x: 90, y: 640, w: 900 } : { x: 860, y: 0, w: 460 };
LIN.ih = LIN.w / (V ? 1.8 : 1.23); LIN.th = 88; LIN.h = LIN.ih + LIN.th; if (!V) LIN.y = L.sc.y - LIN.h / 2;
const CL = V ? { x: 90, y: LIN.y + LIN.h + 30, w: 900, rh: 72 } : { x: 1380, y: 0, w: 440, rh: 104 };
if (!V) CL.y = L.sc.y - (CHECK.length * CL.rh) / 2;
const P5 = () => frameAt(LIN.x + LIN.w * 0.5, LIN.y + LIN.ih * 0.55, V ? 170 : 220);
function worldFutter(g, t, opt = {}) {
  if (opt.bg !== false) { g.fillStyle = WARM; g.fillRect(-W * 2, -H * 2, W * 5, H * 5); }
  if (!opt.noCard) {
    const on = t >= T.checks[0] ? 1 : 0;
    g.fillStyle = '#fff'; g.fillRect(LIN.x, LIN.y, LIN.w, LIN.h);

// ---------------------------------------------------------------------------
// Zoom-Through: A (aussen) mit Kamera MA, darin B im Portal R (A-Koordinaten). p: 0 → 1 = hinein
// ---------------------------------------------------------------------------
function diveM(MA, R, p) {
  // Bildschirmrechteck des Portals unter MA
  const a = MA.transformPoint(new DOMPoint(R.x, R.y)), c = MA.transformPoint(new DOMPoint(R.x + R.w, R.y + R.h));
  const ps = { x: (a.x + c.x) / 2, y: (a.y + c.y) / 2 }, pw = Math.abs(c.x - a.x);
  const Send = W / pw, e = ioc(p), S = Math.exp(Math.log(Send) * e);
  const f = (1 - 1 / S) / (1 - 1 / Send);                         // Portalmitte wandert geradlinig zur Bildmitte
  const at = { x: lerp(ps.x, W / 2, f), y: lerp(ps.y, H / 2, f) };
  const MD = new DOMMatrix().translate(at.x, at.y).scale(S).translate(-ps.x, -ps.y).multiply(MA);
  const k = R.w / W;
  const MB = MD.multiply(new DOMMatrix().translate(R.x + R.w / 2, R.y + R.h / 2).scale(k).translate(-W / 2, -H / 2));
  return { MD, MB, speed: Math.log(Send) };
}
function drawDive(t, p, A, MA, R, B, peek = 1) {
  const { MD, MB } = diveM(MA, R, p);
  g.setTransform(MD); A(g, t);
  g.setTransform(MD); g.save(); g.beginPath(); g.rect(R.x, R.y, R.w, R.h); g.clip();
  g.setTransform(MB); g.globalAlpha = clamp(peek); B(g, t); g.globalAlpha = 1;
  g.restore();
  g.setTransform(MD); focusFrame(g, R, 1 - seg(p, 0.15, 0.45));
}

function draw(t) {

  // Captions: dunkel, plus helle Fassung im Flood-Kreis (Live-Text-Inversion)
  for (const pg of PAGES.filter((p) => { const f = SPR[p.lines[0][0][1]].worte[p.lines[0][0][2]].t; return t >= f - 0.1 && t <= p.aus() + 0.45; })) {
    if (pg.flood && FLOOD) {

    const pr = Math.max(...CLICKS().map((k) => Math.sin(Math.PI * seg(t, k - 0.05, k + 0.13))));

  vg.addColorStop(0, 'rgba(20,16,10,0)'); vg.addColorStop(1, 'rgba(20,16,10,.12)');

}
