const BASE = '../../../quellen/';   // gemeinsame Bilder/Fonts/motion.js (nur gelesen)

// ---------------------------------------------------------------------------
// Zeitplan (aus den Wortzeiten)
// ---------------------------------------------------------------------------
const T = {
  d1: [w('revers', 0) - 0.87, w('revers', 0) - 0.07],           // Match-Cut: Entwurf wird zur Karte «Steigend», Raster fliegt aus der Tiefe

function darkStage(g, t, px = 0, py = 0) {

  const om = (2 * Math.PI) / DUR;
  [[0.7, 0.36, 0.6, '201,160,99', 0.13], [0.2, 0.85, 0.55, '120,88,55', 0.12], [0.45, 0.05, 0.45, '255,240,220', 0.05]].forEach(([bx, by, r0, c, a], i) => {
    const x = W * (bx + 0.06 * Math.sin(om * t * (i + 1) + i * 2)) - px * 0.06, y = H * (by + 0.05 * Math.cos(om * t * (i + 1) + i)) - py * 0.06, R = Math.max(W, H) * r0;

    const x = (((x0 + Math.sin(om * t * 2 + ph) * 50 - px * tief) % (W + 240)) + W + 240) % (W + 240) - 120;
    const y = (((y0 - (H + 240) * (t / DUR) * (tief > 0.5 ? 1 : 0) + Math.sin(om * t + ph) * 40 - py * tief) % (H + 240)) + H + 240) % (H + 240) - 120;
    const a = 0.06 * (0.5 + 0.5 * Math.sin(om * t * 9 + ph)), rg = g.createRadialGradient(x, y, 0, x, y, rad);

// Helle Bühne: Warmweiss mit weichem Licht (Atelier-Tisch)
function warmStage(g, t, px = 0) {

// Weissen Hintergrund einer Illustration freistellen (Flutfüllung von den Rändern) – für Frame Escape
function keyWhite(img) {

  const x = c.getContext('2d'); x.drawImage(img, 0, 0);

let HEROK = null; // freigestellter Entwurf (img/hero-frei.png, ffmpeg floodfill)

// ---------------------------------------------------------------------------
// Bausteine
// ---------------------------------------------------------------------------
function contain(g, img, x, y, w2, h, s = 1) {

  const k = Math.min(w2 / img.width, h / img.height) * s, iw = img.width * k, ih = img.height * k;
  g.drawImage(img, x + (w2 - iw) / 2, y + (h - ih) / 2, iw, ih);
}

  g.drawImage(img, x + (w2 - iw) * fx, y + (h - ih) * fy, iw, ih);
}
function strokeRect(g, x, y, w2, h, col, lw = 1) { g.strokeStyle = col; g.lineWidth = lw; g.strokeRect(x + lw / 2, y + lw / 2, w2 - lw, h - lw); }

  g.fillText(text.toUpperCase(), x + (align === 'center' ? tr / 2 : 0), y); g.textAlign = 'left'; g.letterSpacing = '0px';

      G.save(); G.beginPath(); G.rect(0, 0, W, H); G.arc(IRIS.x, IRIS.y, IRIS.r, 0, Math.PI * 2); G.clip('evenodd'); caption(G, pg, t, true); G.restore();
    } else if (pg.flood && FLOOD) {
      caption(G, pg, t, false);
      G.save(); G.beginPath(); if (FLOOD === 'all') G.rect(0, 0, W, H); else FLOOD.path(G); G.clip(); caption(G, pg, t, true); G.restore();
    } else caption(G, pg, t, pg.light ?? false);
  }
  // Cursor
  const c = cursorPath(t);
  if (CAMNOW) {
    const sc = CAMNOW.transformPoint(new DOMPoint(c.x, c.y));
    const pr = Math.max(...CLICKS().map((k) => Math.sin(Math.PI * seg(t, k - 0.05, k + 0.13))));
    for (const k of CLICKS()) { const p = seg(t, k, k + 0.45); if (p > 0 && p < 1) { G.beginPath(); G.arc(sc.x, sc.y, 12 + 40 * E.outCubic(p), 0, Math.PI * 2); G.strokeStyle = `rgba(201,160,99,${0.6 * (1 - p)})`; G.lineWidth = 2.5; G.stroke(); } }
    if (sc.x < W + 40 && sc.y < H + 40) cursorShape(sc.x, sc.y, pr);
  }
  // Film-Finish
  G.globalAlpha = 0.035; G.globalCompositeOperation = 'overlay';
  const gi = GRAIN[Math.floor(t * 24) % 4];
  for (let x = 0; x < W; x += 480) for (let y = 0; y < H; y += 480) G.drawImage(gi, x, y);
  G.globalCompositeOperation = 'source-over'; G.globalAlpha = 1;
  const vg = G.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(20,16,10,0)'); vg.addColorStop(1, 'rgba(20,16,10,.12)');
  G.fillStyle = vg; G.fillRect(0, 0, W, H);
}
// Liquid Glass hinter einer Caption auf Fotos: unscharfer Ausschnitt, helles Glas, Lichtkante
function glassBehind(pg, t) {
  const first = SPR[pg.lines[0][0][1]].worte[pg.lines[0][0][2]].t, aus = pg.aus();
  const a = p4out((t - first + 0.2) / 0.45) * (1 - p4in((t - aus) / 0.35)); if (a <= 0.01) return;
  const hs = L.hs, y0 = capY(pg.lines.length), x = L.tx - 44, y = y0 - hs - 92, w2 = V ? W - 2 * (L.tx - 44) : 820, h2 = (pg.lines.length - 1) * hs * 1.14 + hs + 150;
  const k = 0.94 + 0.06 * a;
  G.save(); G.translate(x + w2 / 2, y + h2 / 2); G.scale(k, k); G.translate(-(x + w2 / 2), -(y + h2 / 2));
  G.globalAlpha = a; G.beginPath(); G.rect(x, y, w2, h2); G.clip();
  G.filter = 'blur(22px)'; G.drawImage(SC, 0, 0); G.filter = 'none';
  G.fillStyle = 'rgba(255,255,255,.10)'; G.fillRect(x, y, w2, h2);
  G.fillStyle = 'rgba(10,10,10,.18)'; G.fillRect(x, y, w2, h2);
  G.fillStyle = 'rgba(255,255,255,.45)'; G.fillRect(x, y, w2, 1.5);
  G.restore(); G.save(); G.globalAlpha = a; strokeRect(G, x, y, w2, h2, 'rgba(255,255,255,.28)'); G.restore();
}
