# Coolify / Nixpacks: Next.js im Standalone-Modus (output: 'standalone'), wie racher.ch.
# Coolify «Ports Exposes» = 3000. Der Build braucht Netzzugriff auf Shopify (Storefront API).
[variables]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
PORT = "3000"
HOSTNAME = "0.0.0.0"

[phases.setup]
# chromium: PDF-Belege (Angebot, Rechnung, Mahnung) werden aus der A4-Vorlage über Chrome erzeugt (lib/beleg/pdf.ts)
nixPkgs = ["nodejs_22", "chromium"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "npm run build",
  # Inhalte zusammenführen (nicht «cp -r public …/public»: existiert der Ordner schon, entstünde public/public)
  "mkdir -p .next/standalone/public .next/standalone/.next/static",
  "cp -r public/. .next/standalone/public/",
  "cp -r .next/static/. .next/standalone/.next/static/",
]

[start]
cmd = "node .next/standalone/server.js"
