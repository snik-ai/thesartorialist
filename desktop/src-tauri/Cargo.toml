[package]
name = "thesartorialist-desktop"
version = "1.0.0"
description = "The Sartorialist – Admin-Backend für den Mac"
authors = ["DLM Digital"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "thesartorialist_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparentes, randloses Widget-Fenster (nicht für den App Store, für eine eigene Auslieferung erlaubt)
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
# Nur für die Prüf-Funktion (Feature «pruefen»): Schnappschuss der WebView, Lage der Fensterknöpfe
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData", "NSString", "NSError", "NSGeometry"] }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSImage", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[features]
# Automatische Prüfung (nie in Auslieferungen): Skript im Fenster ausführen und Schnappschuss schreiben, siehe src/pruefen.rs
pruefen = ["dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-web-kit"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
