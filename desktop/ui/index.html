<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sartorialist</title>
<style>
  /* Startseite der Mac-App: prüft, ob das Backend erreichbar ist, und wechselt dann dorthin. Ohne Netz: Hinweis mit «Erneut versuchen». */
  :root{color-scheme:dark;--frame:#0d0d0d;--gold:#c9a063}
  html,body{margin:0;height:100%;background:var(--frame);color:#ece9e2;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-user-select:none;user-select:none}
  .zug{position:fixed;inset:0 0 auto 0;height:40px}
  main{height:100%;display:grid;place-items:center;text-align:center}
  .marke{display:grid;justify-items:center;gap:18px}
  .marke img{width:120px;height:auto;opacity:.95;animation:atmen 2.2s ease-in-out infinite}
  .marke i{display:block;width:30px;height:1.5px;background:var(--gold)}
  @keyframes atmen{0%,100%{opacity:.95}50%{opacity:.55}}
  .weg{display:none}
  h1{font:600 22px/1.2 "Playfair Display",Georgia,serif;margin:26px 0 6px;letter-spacing:.01em}
  p{margin:0 0 20px;color:#b9b4aa;max-width:340px}
  button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#f3e6cf;background:transparent;border:1px solid rgba(201,160,99,.6);border-radius:2px;padding:12px 22px;cursor:pointer}
  button:hover{background:rgba(201,160,99,.14)}
  button:focus-visible{outline:2px solid rgba(201,160,99,.6);outline-offset:3px}
  small{display:block;margin-top:14px;font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#8f897d}
  @media (prefers-reduced-motion:reduce){.marke img{animation:none}}
</style>
</head>
<body>
<div class="zug" data-tauri-drag-region></div>
<main>
  <div>
    <div class="marke" aria-hidden="true">
      <img src="monogramm.png" alt="" width="120">
      <i></i>
      <small>Atelier · Backend</small>
    </div>
    <div id="offline" class="weg" role="alert">
      <h1>Keine Verbindung</h1>
      <p>Das Backend ist gerade nicht erreichbar. Bitte das Internet prüfen – sobald es wieder geht, öffnet es sich von selbst.</p>
      <button type="button" id="nochmal">Erneut versuchen</button>
    </div>
  </div>
</main>
<script>
  // Adresse setzt die App (src-tauri/src/lib.rs, Initialisierungsskript): Produktion https://thesartorialist.ch/admin/,
  // Entwicklung http://localhost:3000/admin/ (TS_APP_URL).
  const ziel = window.__TS_START || "https://thesartorialist.ch/admin/";
  const offline = document.getElementById("offline");
  let timer = 0;
  async function versuchen() {
    clearTimeout(timer);
    // Lokale Entwicklung: WKWebView lässt aus der App-Hülle (tauri://) keinen Probe-Abruf auf http://localhost zu – direkt laden
    if (/^(localhost|127\.0\.0\.1)$/.test(new URL(ziel).hostname)) { location.replace(ziel); return; }
    try {
      const ac = new AbortController();
      const t = setTimeout(() => ac.abort(), 8000);
      await fetch(new URL("/admin/manifest.webmanifest", ziel), { mode: "no-cors", cache: "no-store", signal: ac.signal });
      clearTimeout(t);
      location.replace(ziel);
    } catch {
      offline.classList.remove("weg");
      timer = setTimeout(versuchen, 5000);
    }
  }
  document.getElementById("nochmal").addEventListener("click", versuchen);
  window.addEventListener("online", versuchen);
  versuchen();
</script>
</body>
</html>
